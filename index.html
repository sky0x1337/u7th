  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap');

    :root {
      --red: #ff1838;
      --red-dark: #a9001d;
      --red-light: #ff5368;
      --black: #030305;
      --bg: #08090d;
      --card: rgba(18, 18, 24, .72);
      --border: rgba(255, 255, 255, .10);
      --text: #ffffff;
      --muted: #a7a9b3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Noto Sans Thai", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 24, 56, .16), transparent 35%),
        radial-gradient(circle at 90% 70%, rgba(150, 0, 25, .12), transparent 30%),
        var(--black);
    }

    /* Background grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
      z-index: -2;
    }

    /* Red ambient glow */
    body::after {
      content: "";
      position: fixed;
      width: 650px;
      height: 650px;
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255, 0, 35, .08);
      filter: blur(100px);
      pointer-events: none;
      z-index: -3;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px 80px;
      overflow: hidden;
    }

    /* Side red glow */
    .glow-left,
    .glow-right {
      position: absolute;
      width: 300px;
      height: 600px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .13;
      pointer-events: none;
    }

    .glow-left {
      left: -250px;
      top: 20%;
      background: var(--red);
    }

    .glow-right {
      right: -250px;
      bottom: 5%;
      background: #8b0018;
    }

    /* Top badge */
    .top-badge {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 17px;
      border: 1px solid rgba(255, 80, 100, .35);
      border-radius: 999px;
      background: rgba(10, 10, 14, .7);
      backdrop-filter: blur(14px);
      font-size: 12px;
      font-weight: 800;
      color: #f7f7f7;
      white-space: nowrap;
      box-shadow: 0 0 30px rgba(255, 0, 35, .08);
    }

    .top-badge span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff334f;
      box-shadow: 0 0 12px #ff334f;
      animation: pulse 1.7s infinite;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: min(760px, 100%);
      text-align: center;
      margin-top: 35px;
    }

    /* Temporary logo */
    .logo-wrap {
      width: 125px;
      height: 125px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(255, 70, 90, .3);
      background:
        radial-gradient(circle, rgba(255, 35, 60, .16), rgba(0,0,0,.65));
      box-shadow:
        0 0 35px rgba(255, 0, 35, .15),
        inset 0 0 30px rgba(255, 0, 35, .08);
    }

    .logo-placeholder {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -2px;
      color: #fff;
      text-shadow:
        0 0 15px rgba(255, 40, 60, .8),
        0 0 35px rgba(255, 0, 30, .4);
    }

    .logo-placeholder small {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      letter-spacing: 4px;
      color: #ff6879;
    }

    .premium {
      display: inline-flex;
      padding: 7px 15px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #ff334e, #9d001b);
      box-shadow: 0 8px 30px rgba(255, 0, 35, .25);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .5px;
      margin-bottom: 17px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.02;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    h1 .white {
      display: block;
      color: #fff;
    }

    h1 .red {
      display: block;
      background: linear-gradient(
        90deg,
        #ff6b7c 0%,
        #ff1738 45%,
        #c60022 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    .subtitle {
      max-width: 610px;
      margin: 0 auto;
      color: #c2c4cc;
      font-size: 16px;
      line-height: 1.8;
      font-weight: 500;
    }

    /* Stats */
    .stats {
      width: min(520px, 100%);
      margin: 28px auto 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 12px;
      background: rgba(10, 10, 14, .6);
      backdrop-filter: blur(15px);
    }

    .stat {
      position: relative;
      padding: 16px 8px;
    }

    .stat + .stat {
      border-left: 1px solid rgba(255, 255, 255, .10);
    }

    .stat strong {
      display: block;
      color: #fff;
      font-size: 19px;
      font-weight: 900;
    }

    .stat span {
      display: block;
      margin-top: 3px;
      color: #858893;
      font-size: 10px;
      font-weight: 500;
    }

    /* CTA */
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      min-width: 320px;
      min-height: 62px;
      margin-top: 0;
      padding: 0 30px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      background:
        linear-gradient(110deg, #ff0e31, #c30022 55%, #ff304e);
      border: 1px solid rgba(255, 130, 145, .45);
      box-shadow:
        0 12px 35px rgba(255, 0, 35, .28),
        inset 0 1px 0 rgba(255,255,255,.25);
      font-size: 18px;
      font-weight: 900;
      transition: .25s ease;
    }

    .cta:hover {
      transform: translateY(-3px);
      box-shadow:
        0 17px 45px rgba(255, 0, 35, .42),
        inset 0 1px 0 rgba(255,255,255,.3);
    }

    .arrow {
      font-size: 25px;
      line-height: 1;
      transition: transform .25s ease;
    }

    .cta:hover .arrow {
      transform: translateX(5px);
    }

    .cta-note {
      margin-top: 10px;
      color: #737680;
      font-size: 10px;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ff3c57;
      box-shadow: 0 0 12px #ff1f40;
      opacity: .55;
      animation: float 6s ease-in-out infinite;
    }

    .p1 { left: 12%; top: 32%; animation-delay: 0s; }
    .p2 { left: 22%; top: 70%; animation-delay: 1.3s; }
    .p3 { right: 18%; top: 28%; animation-delay: 2s; }
    .p4 { right: 12%; top: 65%; animation-delay: 3s; }
    .p5 { left: 35%; top: 20%; animation-delay: 1s; }
    .p6 { right: 36%; top: 80%; animation-delay: 2.7s; }

    /* Bottom glow */
    .bottom-fade {
      position: absolute;
      bottom: -180px;
      left: 50%;
      width: 900px;
      height: 300px;
      transform: translateX(-50%);
      background: rgba(180, 0, 25, .16);
      filter: blur(90px);
      border-radius: 50%;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .45;
        transform: scale(.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
      }
      50% {
        transform: translateY(-25px) translateX(10px);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .hero {
        min-height: 100svh;
        padding: 85px 18px 55px;
      }

      .top-badge {
        top: 18px;
        font-size: 10px;
        padding: 8px 13px;
      }

      .hero-content {
        margin-top: 15px;
      }

      .logo-wrap {
        width: 105px;
        height: 105px;
        margin-bottom: 22px;
      }

      .logo-placeholder {
        font-size: 23px;
      }

      h1 {
        font-size: clamp(39px, 13vw, 58px);
        letter-spacing: -1.5px;
        line-height: 1.04;
      }

      .subtitle {
        font-size: 13px;
        line-height: 1.7;
        padding: 0 8px;
      }

      .stats {
        margin-top: 23px;
      }

      .stat {
        padding: 13px 5px;
      }

      .stat strong {
        font-size: 16px;
      }

      .stat span {
        font-size: 8px;
      }

      .cta {
        width: 100%;
        min-width: 0;
        min-height: 58px;
        font-size: 16px;
      }

      .cta-note {
        font-size: 9px;
      }
    }
  </style>
</head>

    </section>

    <div class="bottom-fade"></div>

  </main>
